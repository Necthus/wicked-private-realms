name: Native client build
on: [push, pull_request]
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native/build_native.py
      - run: python native/build_host.py
      - run: python native/build_launcher.py
      - run: python native/build_selftest.py
      - run: native/dist/WickedNativeHost.exe --self-test
      - run: python -m pip install -r requirements-dev.txt
      - run: python native/test_native_host.py
